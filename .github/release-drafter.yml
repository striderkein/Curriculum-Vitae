name-template: 'v$RESOLVED_VERSION 🌈'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
  - title: '💪 Enhancement'
    labels:
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🧰 Maintenance'
    label: 'chore'
  - title: '🔧 Refactoring'
    label: 'refactor'
  - title: '📖 Documentation'
    label: 'documentation'
  - title: '⛓️ Dependency update'
    label: 'dependencies'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'

change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.

version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
  patch:
    labels:
      - 'patch'
  default: patch

template: |
  ## Changes

  $CHANGES

autolabeler:
  - label: feature
    branch:
      - '/^feat(ure)?[/-].+/'
  - label: bug
    branch:
      - '/^fix[/-].+/'
  - label: chore
    branch:
      - '/^chore[/-].+/'
  - label: refactor
    branch:
      - '/(refactor|refactoring)[/-].+/'
  # NOTE: files ルールは付けない。職務経歴書リポジトリでは全 PR が *.md を変更するため、
  # 全 PR に documentation が付き、feature 等と重複して同じ PR が複数カテゴリに掲載される
  - label: documentation
    branch:
      - '/doc(umentation|s)[/-].+/'
  - label: enhancement
    branch:
      - '/(enhancement|improve)[/-].+/'

  # - label: nextjs
  #   files:
  #     - 'src/**/*'
  #     - 'package.json'
  #     - 'yarn.lock'
  #     - 'next*'
  #     - 'tsconfig.json'
  #     - '.eslintrc.json'
  - label: docker
    files:
      - 'docker/**/*'
      - 'Dockerfile'
      - '.dockerignore'
  - label: github
    files:
      - '.github/**/*'

